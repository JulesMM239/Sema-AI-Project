services:
  api:
    build:
      context: ./services/api
    environment:
      - APP_DB_URL=postgresql+psycopg2://kkai:kkai@db:5432/kkai
      - JWT_SECRET=${JWT_SECRET}
      - MODEL_SERVICE_URL=http://model_service:8010
      # Local AI
      - ASR_MODEL=${ASR_MODEL}
      - ASR_DEVICE=${ASR_DEVICE}
      - ASR_COMPUTE_TYPE=${ASR_COMPUTE_TYPE}
      # LLM selection: can be managed via Admin Model Registry (recommended)
      # These env vars are still supported as a fallback.
      - LLM_MODEL_PATH=/models/${LLM_GGUF:-}
      - LLM_MODEL_PATHS=${LLM_MODEL_PATHS-}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL-}
      - LLM_CTX=${LLM_CTX}
      - LLM_THREADS=${LLM_THREADS}
      - LLM_GPU_LAYERS=${LLM_GPU_LAYERS}
      - PIPER_BIN=/piper/piper
      - PIPER_MODEL=/models/${PIPER_ONNX}
      - PIPER_CONFIG=/models/${PIPER_JSON}
      - REDIS_URL=redis://redis:6379/0
      - TRAIN_OUTPUT_DIR=/models/trained
      - TRAINED_ROOT=/models/trained

      - DATA_DIR=/models/data
      - UPLOAD_DIR=DATA_DIR / "audio_uploads"
      - LABELS_FILES=DATA_DIR / "audio_labels.jsonl"
    volumes:
      - ./models:/models
      - ./piper:/piper
      - ./services/api/data:/app/data
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    expose:
      - "8000"

  web:
    build:
      context: ./apps/web
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL-http://localhost:8000}
        - NEXT_PUBLIC_MEDIA_BASE_URL=${NEXT_PUBLIC_MEDIA_BASE_URL-http://localhost:8000/media}
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL-http://localhost:8000}
      - NEXT_PUBLIC_MEDIA_BASE_URL=${NEXT_PUBLIC_MEDIA_BASE_URL-http://localhost:8000/media}
    depends_on:
      - api
    ports:
      - "3000:3000"

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=kkai
      - POSTGRES_PASSWORD=kkai
      - POSTGRES_DB=kkai
    volumes:
      - kkai_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./worker
    environment:
      - APP_DB_URL=postgresql+psycopg2://kkai:kkai@db:5432/kkai
      - REDIS_HOST=redis # Redis connection string
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PORT=6379
      - TRAIN_OUTPUT_DIR=/models/trained
    volumes:
      - ./models:/models
      - ./services/api/data:/app/data
    depends_on:
      - db
      - redis 
      - api

  model_service:
    build:
      context: ./services/model_service
      args:
        WITH_LORA: ${WITH_LORA-0}
    environment:
      - DATABASE_URL=postgresql+psycopg://sema:sema@model_db:5432/sema_model
      - REDIS_URL=redis://model_redis:6379/0
      - DATA_DIR=/models/model_service_data
      - SERVICE_PORT=8010
      # Training strategy: stub | lora
      - TRAIN_STRATEGY=${TRAIN_STRATEGY-stub}
      - LORA_BASE_MODEL=${LORA_BASE_MODEL-Qwen/Qwen2.5-0.5B-Instruct}
      - LORA_MAX_STEPS=${LORA_MAX_STEPS-200}
      - LORA_LR=${LORA_LR-0.0002}
      - HF_MODEL_ID=${HF_MODEL_ID-qwen2.5-0.5b-instruct-q4_k_m}
      - HF_MODEL_REPO=${HF_MODEL_REPO-}
      - HF_MODEL_FILE=${HF_MODEL_FILE-}
      - HF_TOKEN=${HF_TOKEN-}
      - HF_CACHE_DIR=/models/model_service_data/hf_cache
      - LLM_CTX=${LLM_CTX-4096}
      - LLM_THREADS=${LLM_THREADS-4}
      - LLM_GPU_LAYERS=${LLM_GPU_LAYERS-0}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS-256}
    depends_on:
      - model_db
      - model_redis
    volumes:
      - ./models/model_service_data:/models/model_service_data
    ports:
      - "8010:8010"

  model_worker:
    build:
      context: ./services/model_service
      args:
        WITH_LORA: ${WITH_LORA-0}
    command: ["python", "-m", "app.worker"]
    environment:
      - DATABASE_URL=postgresql+psycopg://sema:sema@model_db:5432/sema_model
      - REDIS_URL=redis://model_redis:6379/0
      - DATA_DIR=/models/model_service_data
      - TRAIN_STRATEGY=${TRAIN_STRATEGY-stub}
      - LORA_BASE_MODEL=${LORA_BASE_MODEL-Qwen/Qwen2.5-0.5B-Instruct}
      - LORA_MAX_STEPS=${LORA_MAX_STEPS-200}
      - LORA_LR=${LORA_LR-0.0002}
      - HF_MODEL_ID=${HF_MODEL_ID-qwen2.5-0.5b-instruct-q4_k_m}
      - HF_MODEL_REPO=${HF_MODEL_REPO-}
      - HF_MODEL_FILE=${HF_MODEL_FILE-}
      - HF_TOKEN=${HF_TOKEN-}
      - HF_CACHE_DIR=/models/model_service_data/hf_cache
      - LLM_CTX=${LLM_CTX-4096}
      - LLM_THREADS=${LLM_THREADS-4}
      - LLM_GPU_LAYERS=${LLM_GPU_LAYERS-0}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS-256}
    depends_on:
      - model_db
      - model_redis
    volumes:
      - ./models/model_service_data:/models/model_service_data
    restart: unless-stopped

  model_db:
    image: postgres:16
    environment:
      - POSTGRES_USER=sema
      - POSTGRES_PASSWORD=sema
      - POSTGRES_DB=sema_model
    volumes:
      - model_pgdata:/var/lib/postgresql/data

  model_redis:
    image: redis:7-alpine

volumes:
  kkai_pgdata:
  model_pgdata:
  redis_data:
